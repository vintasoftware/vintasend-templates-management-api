name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: poetry run ruff check .
      - name: Check formatting
        run: poetry run ruff format --check .
      - name: Type-check
        run: poetry run mypy
        env:
          VINTASEND_API_KEY: ci
          MANAGED_TEMPLATE_SERVICE_FACTORY: ci.factory
      # openapi.yaml is generated, so a route change that was not regenerated is a stale
      # contract. The test suite asserts the same thing; this fails the lint job with a
      # message naming the command to run.
      - name: Check the generated OpenAPI document is current
        run: poetry run python manage.py export_openapi --check
        env:
          VINTASEND_API_KEY: ci
          MANAGED_TEMPLATE_SERVICE_FACTORY: ci.factory

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The vintasend library supports 3.10-3.14, but this project is additionally
        # bounded by Django: the 5.2 LTS line tops out at 3.13. Raise this when the
        # Django constraint in pyproject.toml moves to a release that supports 3.14.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest
        env:
          VINTASEND_API_KEY: ci
          MANAGED_TEMPLATE_SERVICE_FACTORY: ci.factory
