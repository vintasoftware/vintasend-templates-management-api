[tox]
requires =
    tox>=4
envlist =
    # The vintasend library supports 3.10-3.14, but this project is additionally
    # bounded by Django: the 5.2 LTS line tops out at 3.13. Raise this when the
    # Django constraint in pyproject.toml moves to a release that supports 3.14.
    # Each factor pairs a Python with the Django releases that support it.
    # Django 4.2 tops out at Python 3.12; Django 6.0+ requires Python 3.12.
    py310-{django42,django52}
    py311-{django42,django52}
    py312-{django42,django52,django60,django61}
    py313-{django52,django60,django61}
# Each CI matrix job installs only its own Python, so the other envs have no interpreter.
# Skip them instead of failing -- every version is still exercised by its own matrix job.
skip_missing_interpreters = true
# The dependencies, and the project itself, come from `poetry install` in commands_pre,
# which pins them to poetry.lock. Letting tox also build and install an sdist would
# install the package a second time, from unpinned dependencies.
no_package = true

[gh]
python =
    3.10 = py310-{django42,django52}
    3.11 = py311-{django42,django52}
    3.12 = py312-{django42,django52,django60,django61}
    3.13 = py313-{django52,django60,django61}

[testenv]
description = run tests
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
# The settings module reads both of these at import time and the system check refuses to
# start without them. They are placeholders: no test reaches a real service.
setenv =
    VINTASEND_API_KEY = ci
    MANAGED_TEMPLATE_SERVICE_FACTORY = ci.factory
deps =
    poetry
commands_pre =
    # `poetry install` resolves Django from poetry.lock, which pins a single version.
    # The factor pin therefore has to be installed AFTER it -- installing it first
    # (via `deps`) means poetry silently replaces it and every env tests the locked
    # version instead of the one named in the env.
    poetry install --with dev
    django42: python -m pip install "Django>=4.2,<4.3"
    django52: python -m pip install "Django>=5.2,<5.3"
    django60: python -m pip install "Django>=6.0,<6.1"
    django61: python -m pip install "Django>=6.1,<6.2"
commands =
    poetry run pytest -n auto --cov vintasend_templates_management_api --cov-report=xml:coverage-{envname}.xml {posargs}
