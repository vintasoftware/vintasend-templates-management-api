[project]
name = "vintasend-templates-management-api"
version = "3.2.0"
description = "REST API that exposes a VintaSend ManagedTemplateService over HTTP for template-management UIs"
authors = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
license = "MIT"
readme = "README.md"
# Bounded above by Django rather than by vintasend (which supports 3.14):
# the Django 5.2 LTS line tops out at 3.13.
requires-python = ">=3.10,<3.15"
# Constraints stay under [tool.poetry.dependencies] to keep caret syntax, which
# is not valid PEP 621. 'dynamic' tells build tooling the real list lives there.
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
vintasend = "3.2.0"
vintasend-managed-templates = "3.2.0"
django = ">=4.2,<6.0"
django-ninja = "^1.4.3"
# openapi.yaml is generated from the live route table by `manage.py export_openapi`.
pyyaml = "^6.0.2"
# Reads the .env file in development. Production deployments set real environment
# variables instead, so this is only ever a convenience.
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-django = "^4.11.1"
pytest-xdist = {version = "^3.8.0", extras=["psutil"]}
pytest-cov = "^7.1.0"
tox = "^4.55.0"
# Makes the [gh] section in tox.ini effective: each CI job then runs only the
# envs mapped to its interpreter instead of every env it can find one for.
tox-gh = "^1.8.0"
ruff = "^0.15.22"
mypy = "^2.3.0"
django-stubs = "^5.2.0"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vintasend_templates_management_api.settings"
python_files = ["test_*.py"]
# The tests live inside the package, next to what they exercise.
testpaths = ["vintasend_templates_management_api"]
addopts = [
    # Fail on an unregistered marker or an unknown ini key rather than ignoring it. Both
    # typos are silent by default: a misspelled marker simply never matches, so a test you
    # believe is excluded keeps running (or one you believe runs never does).
    "--strict-markers",
    "--strict-config",
    # Summarise everything that did not plainly pass, so a skip or an xfail that should
    # have been fixed stays visible instead of scrolling past as a dot.
    "-ra",
    # Coverage runs on every invocation and fails the suite below the floor, so a coverage
    # regression surfaces in the same run as a behaviour regression. Branch coverage
    # because most of the risk here is in conditionals -- capability negotiation, optional
    # `version` handling, the status transition table.
    "--cov=vintasend_templates_management_api",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
    # Keep each test module on one xdist worker. The suite mutates a process-wide service
    # singleton, so splitting a module across workers would be a needless risk.
    "--dist=loadscope",
]
# The suite is warning-clean, so a new warning is a regression worth failing on -- a
# deprecation from Django, pydantic or ninja is exactly the signal that gets ignored
# otherwise, right up until the release that removes the thing.
filterwarnings = ["error"]
# An `xfail` that starts passing is a failure: it means the bug is fixed and the marker
# should go, which is worth being told about rather than silently reported as xpass.
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["vintasend_templates_management_api"]
omit = [
    # Process entrypoints. Both are three lines that a WSGI/ASGI server imports and no test
    # ever does; counting them would only ever mean "the server was not started".
    "*/wsgi.py",
    "*/asgi.py",
    # The suite's own code. Measuring how thoroughly the tests test themselves inflates the
    # headline number and hides gaps in the code that actually ships.
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    # Bodies that exist only to satisfy the ABC / typing, never executed.
    "^\\s*\\.\\.\\.$",
    "if TYPE_CHECKING:",
    # A guard that only fires on a misconfigured deployment, raising immediately.
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
indent-width = 4
# Must track the MINIMUM Python in [tool.poetry.dependencies]. Setting this higher
# lets pyupgrade rewrite code into syntax that breaks the older interpreters this
# project still supports.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "S", "BLE", "A", "I", "G", "INP", "RUF"]
ignore = [
    "E501",
    # Allow `except Exception`: the error handler deliberately catches everything so a
    # backend failure becomes an INTERNAL_ERROR envelope instead of a stack trace.
    "BLE001",
    "RUF100",
    "UP035",
    "UP037",
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
"django" = ["django", "ninja"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F403", "F405"]
"**/tests/*" = ["S", "N802", "N815"]
# The wire contract is written with camelCase attribute names on purpose: the schema
# classes are meant to be read side by side with the generated `openapi.yaml`. Renaming
# them to snake_case with aliases would hide the one thing these classes exist to make
# obvious.
"vintasend_templates_management_api/templates_manager/contract.py" = ["N815"]
"vintasend_templates_management_api/templates_manager/query.py" = ["N815"]
# The dotted name is the point: this file is copied to `vintasend_config.py`, never
# imported as it stands.
"vintasend_templates_management_api/vintasend_config.example.py" = ["N999"]

[tool.mypy]
files = ["vintasend_templates_management_api"]
# Must track the MINIMUM Python in [tool.poetry.dependencies], so errors that only
# appear on the oldest interpreter are not hidden.
python_version = "3.10"
show_error_codes = true
strict_equality = true
warn_no_return = true
# django-stubs. The plugin (not just the stub package) is what makes `settings.FOO`
# resolve against this project's own settings module rather than coming back as `Any`,
# so it earns its keep beyond the bundled Django stubs -- see [tool.django-stubs] below.
plugins = ["mypy_django_plugin.main"]

# Everything below is on because the code passes it today. Each was measured before being
# enabled; anything that would have needed code changes is listed as deferred instead.
#
# Untyped code is the thing most worth keeping out: a function missing an annotation is
# silently exempt from checking, which is how a project ends up nominally type-checked and
# actually not.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
# Catches an `Any` leaking out through a typed signature -- the failure mode that makes a
# return annotation a comment rather than a check.
warn_return_any = true
# A `type: ignore` that stopped being needed is a claim the code no longer makes. Safe to
# enable here, unlike in the root package, because this project has no optional
# dependencies whose presence changes which ignores are live.
warn_unused_ignores = true
warn_redundant_casts = true
# This project ships no py.typed and is an application, not a library, so its re-export
# surface is not a public API. On anyway: it keeps a module from acquiring a name it never
# meant to export, which is what makes an import cycle easy to introduce by accident.
no_implicit_reexport = true
extra_checks = true

# Deliberately NOT enabled, each needing a round of code changes first. Counts are from
# the current tree; re-measure with `mypy --<flag>` before acting on one.
#   disallow_any_generics   (31 hits) - `ManagedTemplateService` and `ManagedTemplateRenderer`
#                                       are generic in their template-content type, and the
#                                       TypeVar is invariant. Parameterising every mention
#                                       would reject a concretely-typed service where a
#                                       general one is expected, so the realistic fix is
#                                       `[Any]` at each boundary -- more `Any`, not less.
#                                       Worth revisiting if the seam's TypeVar becomes
#                                       covariant, or if ServiceCaller itself goes generic.
#   disallow_any_explicit   (59 hits) - would ban the remaining deliberate `Any`s, which are
#                                       the in-memory filter evaluator in tests/fakes.py and
#                                       the OpenAPI document in export_openapi.py. Both are
#                                       genuinely dynamic; typing them costs casts.
#   --strict                (34 hits) - the union of the two above.

[tool.django-stubs]
django_settings_module = "vintasend_templates_management_api.settings"
