              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'List tags, newest filter first: by status, by a text search, or
        by tenant.


        A tag picker wants ``?status=active``: archived tags are still attached to
        the templates

        carrying them and can still be filtered on, they are simply no longer offered.'
      tags:
      - tags
      security:
      - ApiKeyAuth: []
    post:
      operationId: vintasend_templates_management_api_templates_manager_api_create_tag
      summary: Create Tag
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse_ManagedTemplateTagOut_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'Define a tag ahead of any template using it.


        Tagging a template creates missing tags on its own, so this is for the case
        where a

        collision with an existing tag is worth hearing about -- it is a 409 here,
        where tagging

        a template would silently resolve to the tag already there.'
      tags:
      - tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagBody'
        required: true
      security:
      - ApiKeyAuth: []
  /api/v1/tags/{slug}:
    get:
      operationId: vintasend_templates_management_api_templates_manager_api_get_tag
      summary: Get Tag
      parameters:
