          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'Retire a tag from the pickers without touching the templates carrying
        it.


        Filtering by an archived tag still returns those templates -- archiving hides
        the tag

        from ``?status=active``, it does not hide the templates.'
