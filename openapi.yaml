            type: integer
          - type: 'null'
          title: Version
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse_ManagedTemplateOut_'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: One version of a template. Omitting ``version`` returns the latest.
      tags:
      - templates
      security:
      - ApiKeyAuth: []
    delete:
      operationId: vintasend_templates_management_api_templates_manager_api_delete_template
      summary: Delete Template
      parameters:
      - in: path
        name: key
        schema:
          title: Key
          type: string
        required: true
      - in: query
        name: version
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Version
        required: false
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'Delete one version of a template, or its latest version when ``version``
        is omitted.


        This deletes a *version*, never a whole key: the seam has no operation that
        removes

        every version at once, and doing it here as a loop would be a multi-step deletion
        with

        no transaction around it.


        Only a draft that was never published can be deleted. Any other version is
        a 409

        ``CONFLICT``: archive it instead.'
      tags:
      - templates
      security:
      - ApiKeyAuth: []
  /health:
    get:
      operationId: vintasend_templates_management_api_templates_manager_api_health
      summary: Health
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
      tags:
      - system
components:
  schemas:
