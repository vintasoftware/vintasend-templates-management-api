          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse_ManagedTemplateTagOut_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'Put an archived tag back on offer.


        Unlike an archived template version -- terminal, because reviving one would
        rewrite what

        its audit trail says happened -- a tag carries no history to contradict, so
        archiving one

        is reversible.'
      tags:
      - tags
      security:
      - ApiKeyAuth: []
  /api/v1/templates/{key}:
    get:
      operationId: vintasend_templates_management_api_templates_manager_api_get_template
      summary: Get Template
      parameters:
      - in: path
        name: key
        schema:
          title: Key
          type: string
        required: true
      - in: query
        name: version
