          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: One tag. The path accepts the tag's slug or the text it was created
        from.
      tags:
      - tags
      security:
      - ApiKeyAuth: []
    patch:
      operationId: vintasend_templates_management_api_templates_manager_api_update_tag
      summary: Update Tag
      parameters:
      - in: path
        name: slug
        schema:
          title: Slug
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse_ManagedTemplateTagOut_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'Rename a tag. Its slug is regenerated, so its URL changes.


        The templates carrying the tag keep it, but a stored filter naming the old
        slug stops

        matching -- read ``slug`` off the response and store that. Renaming a tag
        onto another

        tag''s text is allowed and yields a ``-2`` suffix: two tags may legitimately
        read the

        same, and the slug is what tells them apart.'
      tags:
      - tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagBody'
        required: true
      security:
      - ApiKeyAuth: []
    delete:
      operationId: vintasend_templates_management_api_templates_manager_api_delete_tag
      summary: Delete Tag
      parameters:
      - in: path
