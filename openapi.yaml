                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      description: 'Delete a tag, removing the label from every template carrying
        it.


        Not reversible, and the templates lose the label. Archive instead when the
        tag should

        stop being offered but the templates should keep it.'
      tags:
      - tags
      security:
      - ApiKeyAuth: []
  /api/v1/tags/{slug}/archive:
