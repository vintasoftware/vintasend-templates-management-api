    JsonValue: {}
    TemplateListQuery:
      description: 'Filters accepted by ``GET /api/v1/templates``.


        Every filter present is combined with AND, which is what a bare field filter
        means in

        the library''s filter vocabulary.


        ``mostRecentActiveVersion`` is the one filter that is on unless a client turns
        it off,

        and the one whose default changes what a bare ``GET /templates`` returns:
        one row per

        key instead of one per version.


        ``orderByField`` and ``orderByDirection`` have no default: most backends can
        order by

        nothing, so a default would make the common listing a 400 against them. Omitted
        asks for

        the backend own order. An order the backend cannot apply is a 400 rather than
        a silent

        drop -- unlike a dropped filter, a dropped order leaves no trace in the rows.'
      properties:
        page:
          default: 1
          minimum: 1
          title: Page
          type: integer
        pageSize:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        templateManagedBackend:
          anyOf:
          - type: string
          - type: 'null'
          title: Templatemanagedbackend
        version:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Version
        status:
          anyOf:
          - items:
              enum:
              - draft
              - active
              - inactive
              - archived
              type: string
            type: array
          - type: 'null'
          title: Status
        createdAtFrom:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Createdatfrom
        createdAtTo:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Createdatto
        updatedAtFrom:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updatedatfrom
        updatedAtTo:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updatedatto
        includesAllTags:
          anyOf:
          - items:
              type: string
            maxItems: 50
            type: array
          - type: 'null'
          title: Includesalltags
        includesAnyOfTags:
          anyOf:
          - items:
              type: string
            maxItems: 50
            type: array
          - type: 'null'
          title: Includesanyoftags
        mostRecentActiveVersion:
          default: true
          title: Mostrecentactiveversion
          type: boolean
        isAbstract:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Isabstract
        orderByField:
          anyOf:
          - enum:
            - key
            - name
            - version
            - status
            - createdAt
            - updatedAt
            type: string
          - type: 'null'
          title: Orderbyfield
        orderByDirection:
          anyOf:
          - enum:
            - asc
            - desc
            type: string
          - type: 'null'
          title: Orderbydirection
      title: TemplateListQuery
      type: object
    ManagedTemplateOut:
      description: 'One version of a managed template.


        Templates are versioned rather than edited in place, so this is always a specific

        version of ``key`` -- never "the template" in the abstract.'
      properties:
        id:
          title: Id
          type: string
        key:
          title: Key
          type: string
        version:
          title: Version
          type: integer
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        templateManagedBackend:
          title: Templatemanagedbackend
          type: string
        bodyTemplate:
          title: Bodytemplate
          type: string
        subjectTemplate:
          anyOf:
          - type: string
          - type: 'null'
          title: Subjecttemplate
        preheaderTemplate:
          anyOf:
          - type: string
          - type: 'null'
          title: Preheadertemplate
        status:
          enum:
          - draft
          - active
          - inactive
          - archived
          title: Status
          type: string
        tenant:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant
        createdAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdat
        updatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Updatedat
        tags:
          items:
            $ref: '#/components/schemas/ManagedTemplateTagOut'
          title: Tags
          type: array
        allowedTransitions:
          items:
            enum:
            - draft
            - active
            - inactive
            - archived
            type: string
          title: Allowedtransitions
          type: array
        isAbstract:
          title: Isabstract
          type: boolean
      required:
      - id
      - key
      - version
      - name
      - description
      - templateManagedBackend
      - bodyTemplate
      - subjectTemplate
      - preheaderTemplate
      - status
      - tenant
      - createdAt
      - updatedAt
      - tags
      - allowedTransitions
      - isAbstract
      title: ManagedTemplateOut
      type: object
    ManagedTemplateTagOut:
      description: 'A label attached to any number of template versions.


        ``slug`` is the tag''s identity: it is normalized from ``text``, unique store-wide,
        and

        what the ``includesAllTags`` / ``includesAnyOfTags`` filters match on. A client
        that

        stores a tag reference should store the slug, and re-read it after a rename
        -- editing

        ``text`` regenerates the slug, so the old one stops matching.'
      properties:
        id:
          title: Id
          type: string
        text:
          title: Text
          type: string
        slug:
          title: Slug
          type: string
        status:
          enum:
          - active
          - archived
          title: Status
          type: string
        tenant:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant
        createdAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdat
        updatedAt:
          anyOf:
          - type: string
          - type: 'null'
          title: Updatedat
      required:
      - id
      - text
      - slug
      - status
      - tenant
      - createdAt
      - updatedAt
      title: ManagedTemplateTagOut
      type: object
    PaginatedResponse_ManagedTemplateOut_:
