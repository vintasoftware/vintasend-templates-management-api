          title: Data
          type: array
      required:
      - data
      title: ListResponse[ManagedTemplateOut]
      type: object
    CreateVersionBody:
      description: 'Body of ``POST /api/v1/templates/{key}/versions``.


        Every field is optional and ``None`` means "carry this one forward": the backend
        copies

        the latest version and applies only the fields that are set. That is why there
        is no

        ``templateManagedBackend`` or ``tenant`` here -- ``ManagedTemplateUpdateInput``
        carries

        neither, so neither can change across versions of one key.


        A body with nothing set is accepted and produces a new version identical to
        the latest,

        which is a legitimate way to branch a version off for a status change.'
      properties:
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        bodyTemplate:
          anyOf:
          - maxLength: 1000000
            minLength: 1
            type: string
          - type: 'null'
          title: Bodytemplate
        subjectTemplate:
          anyOf:
          - maxLength: 1000000
            type: string
          - type: 'null'
          title: Subjecttemplate
        preheaderTemplate:
          anyOf:
          - maxLength: 1000000
            type: string
          - type: 'null'
          title: Preheadertemplate
        tags:
          anyOf:
          - items:
              type: string
            maxItems: 50
            type: array
          - type: 'null'
          title: Tags
      title: CreateVersionBody
      type: object
    VersionQuery:
      description: '``version`` on an endpoint that acts on the latest version when
        it is omitted.


        ``None`` is not "no version" in the sense of "all versions" -- it is the service''s

        documented shorthand for "the latest one", and every route that takes this
        passes it

        through unchanged.'
      properties:
        version:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Version
      title: VersionQuery
      type: object
    DataResponse_TemplateCompositionOut_:
      properties:
        data:
          $ref: '#/components/schemas/TemplateCompositionOut'
      required:
      - data
      title: DataResponse[TemplateCompositionOut]
      type: object
    TemplateCompositionOut:
      description: 'A template version assembled the way the engine will receive it.


        Composition is resolved before any template engine runs: a version that extends
        a base

        or includes a fragment reaches the engine as one flat string with no ``managed_*``
        tag

        left in it. The stored sources on ``ManagedTemplateOut`` are what someone
        typed; these

        are what actually renders.


        Nothing here is rendered against a context -- ``{{ name }}`` and every other
        engine tag

        survives untouched. Use ``POST /templates/{key}/preview`` to see the rendered
        result.'
      properties:
        key:
          title: Key
          type: string
        version:
          title: Version
          type: integer
        isAbstract:
          title: Isabstract
          type: boolean
        references:
          items:
            $ref: '#/components/schemas/TemplateReferenceOut'
          title: References
          type: array
        composedBodyTemplate:
          title: Composedbodytemplate
          type: string
        composedSubjectTemplate:
          anyOf:
          - type: string
          - type: 'null'
          title: Composedsubjecttemplate
        composedPreheaderTemplate:
          anyOf:
          - type: string
          - type: 'null'
          title: Composedpreheadertemplate
      required:
      - key
      - version
      - isAbstract
      - references
      - composedBodyTemplate
      - composedSubjectTemplate
      - composedPreheaderTemplate
      title: TemplateCompositionOut
      type: object
    TemplateReferenceOut:
      description: 'One template this version directly extends or includes.


        Direct references only -- what the referenced templates themselves reference
        is not

        followed. ``version`` is null when the reference names no version, which resolves
        to

        whatever that key currently is at render time.'
      properties:
        kind:
          enum:
          - extends
          - include
          title: Kind
          type: string
        key:
          title: Key
          type: string
        version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
        field:
          enum:
          - bodyTemplate
          - subjectTemplate
          - preheaderTemplate
          title: Field
          type: string
      required:
      - kind
      - key
      - version
      - field
      title: TemplateReferenceOut
      type: object
    StatusHistoryQuery:
      description: '``version`` on the status-history endpoint, where omitting it
        means every version.


        This is the one place ``version=None`` does *not* mean "the latest": the service

        forwards it to the backend, which returns the whole key''s history when the
        backend

        supports it.'
      properties:
        version:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          title: Version
      title: StatusHistoryQuery
      type: object
    ListResponse_TemplateStatusHistoryOut_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TemplateStatusHistoryOut'
          title: Data
          type: array
      required:
      - data
      title: ListResponse[TemplateStatusHistoryOut]
      type: object
    TemplateStatusHistoryOut:
